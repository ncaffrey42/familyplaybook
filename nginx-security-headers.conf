# Shared security headers.
#
# IMPORTANT nginx behavior: add_header directives are inherited from the
# enclosing block ONLY when a location declares no add_header of its own.
# Any location that sets even one header (e.g. Cache-Control) silently drops
# every server-level header. So this file must be include'd in EVERY location
# block that uses add_header, as well as at server level for locations that
# don't.
#
# The CSP must stay on ONE line — a multi-line quoted value would embed raw
# newlines in the header, which is invalid HTTP.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy
#   Supabase: auth/data API + realtime websocket + storage media
#   Stripe: js.stripe.com script + frames for Checkout/portal redirects
#   script-src has no 'unsafe-inline': the Vite build emits only external
#   module scripts, and Stripe.js does not require inline script.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in; media-src 'self' blob: https://*.supabase.co https://*.supabase.in; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
