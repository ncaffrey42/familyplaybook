server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Security headers for locations that declare no add_header of their own.
    # Locations below that DO use add_header must re-include this file —
    # nginx drops all inherited add_header directives the moment a location
    # defines one (see the note inside the include).
    include /etc/nginx/security-headers.conf;

    # Cache static assets aggressively (Vite fingerprints them).
    # Cache-Control is set via add_header alone — combining it with `expires`
    # would emit a second, conflicting Cache-Control header.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Never cache the HTML shell (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
